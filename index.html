
<!DOCTYPE html>
<html lang="ar" dir="rtl" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeServe Pro | خدمات منزلية محترفة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1e40af',
              secondary: '#f97316',
              accent: '#10b981',
            },
            fontFamily: {
              sans: ['Cairo', 'Tajawal', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --base-font-size: 16px;
      }
      html[lang="ar"] {
        --base-font-size: 17px;
      }
      body {
        font-family: 'Cairo', 'Tajawal', sans-serif;
        font-size: var(--base-font-size);
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark .glass {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
      }
      h1, h2, h3, h4 {
        line-height: 1.3 !important;
      }
      /* Shimmer Sweep Effect */
      .shimmer-sweep {
        position: relative;
        overflow: hidden;
      }
      .shimmer-sweep::after {
        content: "";
        position: absolute;
        top: 0;
        left: -150%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent
        );
        transform: skewX(-25deg);
        animation: shimmer-sweep-anim 4s infinite;
      }
      @keyframes shimmer-sweep-anim {
        0% { left: -150%; }
        20% { left: 150%; }
        100% { left: 150%; }
      }
      /* Icon Pop Effect */
      .icon-pop {
        animation: icon-pop-anim 4s infinite;
      }
      @keyframes icon-pop-anim {
        0%, 15%, 25%, 100% { transform: scale(1); }
        20% { transform: scale(1.3); }
      }
      /* Prevent anchor outline on buttons used as nav links */
      button:focus {
        outline: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
</head>
  <body class="bg-white text-slate-900 transition-colors duration-300">
    <div id="root"></div>
  </body>
</html>
